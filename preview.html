<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello GitHub Copilot! — TEST-5001 Preview</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 + ReactDOM 18 (UMD / development builds) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel Standalone (transpiles JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* Fade-in + slide-up keyframe for page load animation */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.7s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      /* ─────────────────────────────────────────────
       * ATOM: GreetingText
       * ───────────────────────────────────────────── */
      function GreetingText({ text }) {
        return (
          <h1
            role="heading"
            aria-level="1"
            aria-label={text}
            className="text-5xl md:text-6xl lg:text-7xl font-extrabold tracking-tight text-center"
          >
            {text}
          </h1>
        );
      }

      /* ─────────────────────────────────────────────
       * ATOM: GreetingBadge
       * ───────────────────────────────────────────── */
      function GreetingBadge({ label = 'Powered by Claude Sonnet via GitHub Copilot' }) {
        const [hovered, setHovered] = useState(false);

        return (
          <div
            role="status"
            aria-label={label}
            onMouseEnter={() => setHovered(true)}
            onMouseLeave={() => setHovered(false)}
            className={[
              'inline-flex items-center gap-2 px-3 py-1 rounded-full',
              'text-sm font-medium text-gray-600 border border-gray-200',
              'transition-colors duration-300 cursor-default select-none',
              hovered ? 'bg-blue-50' : 'bg-gray-100',
            ].join(' ')}
          >
            {/* 온라인/활성 상태 녹색 점 */}
            <span className="w-2 h-2 rounded-full bg-green-500" aria-hidden="true" />
            {/* 배지 텍스트 */}
            <span className="text-sm">{label}</span>
          </div>
        );
      }

      /* ─────────────────────────────────────────────
       * MOLECULE: HelloWorldCard
       * ───────────────────────────────────────────── */
      function HelloWorldCard({ greetingText, badgeLabel }) {
        const [hovered, setHovered] = useState(false);

        return (
          <section
            role="region"
            aria-label="Hello World greeting card"
            onMouseEnter={() => setHovered(true)}
            onMouseLeave={() => setHovered(false)}
            className={[
              'flex flex-col items-center justify-center gap-6',
              'bg-white rounded-2xl p-10 md:p-16 max-w-2xl w-full mx-auto',
              'transition-all duration-300',
              hovered ? 'scale-105 shadow-2xl' : 'scale-100 shadow-lg',
            ].join(' ')}
          >
            <GreetingText text={greetingText} />

            {/* 서브타이틀 */}
            <p className="text-base md:text-lg text-gray-500 text-center">
              Claude 3.5 Sonnet 모델 테스트 배포
            </p>

            <GreetingBadge label={badgeLabel} />
          </section>
        );
      }

      /* ─────────────────────────────────────────────
       * PAGE: HelloWorldPage
       * ───────────────────────────────────────────── */
      function HelloWorldPage() {
        const [visible, setVisible] = useState(false);

        // 페이지 진입 시 카드 페이드인
        useEffect(() => {
          const t = setTimeout(() => setVisible(true), 80);
          return () => clearTimeout(t);
        }, []);

        return (
          <main
            role="main"
            aria-label="Hello GitHub Copilot page"
            className="min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-slate-50 to-blue-50 px-4 py-12"
          >
            <div
              className={[
                'w-full transition-all duration-700 ease-out',
                visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6',
              ].join(' ')}
            >
              <HelloWorldCard
                greetingText="Hello GitHub Copilot!"
                badgeLabel="Powered by Claude Sonnet via GitHub Copilot"
              />
            </div>
          </main>
        );
      }

      /* ─────────────────────────────────────────────
       * ROOT: App
       * ───────────────────────────────────────────── */
      function App() {
        return <HelloWorldPage />;
      }

      /* Mount */
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
