<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>BASEBALL-011 스코어보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gray: {
              100: '#f3f4f6',
              200: '#e5e7eb',
              400: '#9ca3af',
              500: '#6b7280',
              600: '#4b5563',
              700: '#374151',
              800: '#1f2937',
              900: '#111827',
              950: '#030712'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Atoms
    const TeamAvatar = ({ initials, teamColor = '#374151', size = 'md', logoSrc }) => {
      const [imageError, setImageError] = useState(false);
      const sizeMap = {
        sm: 'w-7 h-7 text-xs',
        md: 'w-10 h-10 text-sm',
        lg: 'w-14 h-14 text-xl',
      };
      const showImage = logoSrc && !imageError;
      return (
        <div
          role="img"
          aria-label={`${initials} 팀 로고`}
          className={`flex items-center justify-center rounded-full font-extrabold tracking-tight select-none shrink-0 overflow-hidden ${sizeMap[size]}`}
          style={{ backgroundColor: showImage ? 'transparent' : teamColor }}
        >
          {showImage ? (
            <img
              src={logoSrc}
              alt={`${initials} 팀 로고`}
              className="w-full h-full object-cover"
              onError={() => setImageError(true)}
            />
          ) : (
            <span className="text-white">{initials}</span>
          )}
        </div>
      );
    };

    const InningCell = ({ score, isCurrent, isHeader = false, inningNumber }) => {
      const ariaLabel = isHeader
        ? `${inningNumber}회`
        : isCurrent
        ? `현재 ${inningNumber}회 ${score ?? '진행 중'}점`
        : `${inningNumber}회 ${score ?? '미진행'}점`;

      const baseClasses = 'flex items-center justify-center w-8 h-9 sm:w-10 sm:h-10 text-sm font-bold tabular-nums transition-colors duration-200 shrink-0';

      let variantClasses = 'bg-transparent text-gray-200';
      if (isHeader) {
        variantClasses = 'bg-transparent text-gray-500 text-xs font-semibold uppercase';
      } else if (isCurrent) {
        variantClasses = 'bg-yellow-400 text-gray-900 rounded font-extrabold ring-2 ring-yellow-300 shadow-yellow-400/50 shadow-md';
      } else if (score === null) {
        variantClasses = 'bg-transparent text-gray-600';
      }

      const content = isHeader ? inningNumber : score === null ? '-' : score;

      return (
        <div role="cell" aria-label={ariaLabel} className={`${baseClasses} ${variantClasses}`}>
          {content}
        </div>
      );
    };

    const StatCell = ({ value, statType, isHeader = false }) => {
      const ariaLabel = isHeader ? `${statType} 통계 항목` : `${statType} ${value}`;
      const baseClasses = 'flex items-center justify-center w-10 h-9 sm:w-12 sm:h-10 text-sm font-bold tabular-nums shrink-0';

      let variantClasses = 'text-gray-200';
      if (isHeader) {
        variantClasses = 'text-gray-400 text-xs font-semibold uppercase tracking-wider';
      } else {
        switch (statType) {
          case 'H': variantClasses = 'text-green-400 font-extrabold'; break;
          case 'E': variantClasses = 'text-red-400 font-extrabold'; break;
          case 'BB': variantClasses = 'text-blue-400 font-extrabold'; break;
          case 'R': variantClasses = 'text-yellow-300 font-extrabold'; break;
        }
      }

      return (
        <div role="cell" aria-label={ariaLabel} className={`${baseClasses} ${variantClasses}`}>
          {value}
        </div>
      );
    };

    const GameStatusBadge = ({ status, currentInning, inningHalf }) => {
      const ariaLabel =
        status === 'final' ? '경기 종료'
        : status === 'live' ? `${currentInning}회 ${inningHalf === 'top' ? '초' : '말'} 진행 중`
        : '경기 전';

      const baseClasses = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold tracking-widest uppercase select-none';

      let variantClasses = '';
      let label = '';
      let icon = '';

      if (status === 'scheduled') {
        variantClasses = 'bg-gray-700 text-gray-300 border border-gray-600';
        label = '경기 전';
        icon = '🕐';
      } else if (status === 'live') {
        variantClasses = 'bg-red-600 text-white shadow-red-500/50 shadow-md animate-pulse border border-red-400';
        label = `${inningHalf === 'top' ? '▲' : '▼'} ${currentInning}회`;
        icon = '🔴';
      } else if (status === 'final') {
        variantClasses = 'bg-yellow-400 text-gray-900 shadow-yellow-400/40 shadow-md border border-yellow-300';
        label = 'FINAL';
        icon = '✅';
      }

      return (
        <div role="status" aria-live="polite" aria-label={`경기 상태: ${ariaLabel}`} className={`${baseClasses} ${variantClasses}`}>
          <span>{icon}</span>
          <span>{label}</span>
        </div>
      );
    };

    const TotalScoreCell = ({ score, isWinning = false, isHeader = false }) => {
      const ariaLabel = isHeader ? '총 득점' : `합계 ${score ?? 0}점${isWinning ? ' (리드 중)' : ''}`;
      const baseClasses = 'flex items-center justify-center w-12 h-9 sm:w-14 sm:h-10 text-lg font-black tabular-nums border-l border-gray-600 shrink-0';

      let variantClasses = 'text-white';
      if (isHeader) {
        variantClasses = 'text-gray-400 text-xs font-semibold uppercase tracking-wider text-sm';
      } else if (isWinning) {
        variantClasses = 'text-yellow-300';
      }

      const content = isHeader ? 'R' : score === null ? '-' : score;

      return (
        <div role="cell" aria-label={ariaLabel} className={`${baseClasses} ${variantClasses}`}>
          {content}
        </div>
      );
    };

    const SectionLabel = ({ text, variant = 'default' }) => {
      const baseClasses = 'inline-block text-xs tracking-wider select-none';
      let variantClasses = 'text-gray-400';
      if (variant === 'muted') variantClasses = 'text-gray-600';
      else if (variant === 'highlight') variantClasses = 'text-yellow-400 font-semibold';

      return (
        <span role="none" className={`${baseClasses} ${variantClasses}`}>
          {text}
        </span>
      );
    };

    // Molecules
    const TeamInfoRow = ({ teamName, teamShortName, initials, teamColor, logoSrc }) => {
      return (
        <div
          role="rowheader"
          aria-label={teamName}
          className="flex items-center gap-2 sm:gap-3 min-w-[120px] sm:min-w-[160px] px-2 sm:px-3 h-9 sm:h-10 shrink-0"
        >
          <TeamAvatar initials={initials} teamColor={teamColor} size="sm" logoSrc={logoSrc} />
          <div className="flex flex-col min-w-0">
            <span className="hidden sm:block text-sm font-bold text-gray-100 truncate">
              {teamName}
            </span>
            <span className="sm:hidden text-sm font-bold text-gray-100 truncate">
              {teamShortName}
            </span>
          </div>
        </div>
      );
    };

    const InningHeaderRow = ({ totalInnings = 9, currentInning, showExtended = false }) => {
      const innings = Array.from({ length: totalInnings }, (_, i) => i + 1);

      return (
        <div
          role="row"
          aria-label="스코어보드 컬럼 헤더"
          className="flex items-center sticky top-0 z-10 bg-gray-900 border-b border-gray-700"
        >
          <div className="min-w-[120px] sm:min-w-[160px] h-8 px-2 sm:px-3 flex items-center">
            <span className="text-xs text-gray-500 uppercase tracking-wider font-semibold">팀</span>
          </div>
          <div className="flex items-center">
            {innings.map((inning) => (
              <InningCell
                key={inning}
                score={null}
                isCurrent={inning === currentInning}
                isHeader={true}
                inningNumber={inning}
              />
            ))}
          </div>
          <div className="flex items-center border-l border-gray-600">
            <TotalScoreCell score={null} isHeader={true} />
            <StatCell value="H" statType="H" isHeader={true} />
            <StatCell value="E" statType="E" isHeader={true} />
            <StatCell value="BB" statType="BB" isHeader={true} />
          </div>
        </div>
      );
    };

    const InningScoreRow = ({
      teamName,
      teamShortName,
      initials,
      teamColor,
      logoSrc,
      scores,
      totalRuns,
      hits,
      errors,
      walks,
      currentInning,
      isWinning = false,
      totalInnings = 9,
    }) => {
      const displayScores = [...scores];
      while (displayScores.length < totalInnings) {
        displayScores.push(null);
      }

      return (
        <div
          role="row"
          aria-label={`${teamName} 점수 행`}
          className="flex items-center border-b border-gray-800 hover:bg-gray-800/30 transition-colors duration-150"
        >
          <TeamInfoRow
            teamName={teamName}
            teamShortName={teamShortName}
            initials={initials}
            teamColor={teamColor}
            logoSrc={logoSrc}
          />
          <div className="flex items-center">
            {displayScores.slice(0, totalInnings).map((score, index) => (
              <InningCell
                key={index}
                score={score}
                isCurrent={index + 1 === currentInning}
              />
            ))}
          </div>
          <div className="flex items-center">
            <TotalScoreCell score={totalRuns} isWinning={isWinning} />
            <StatCell value={hits} statType="H" />
            <StatCell value={errors} statType="E" />
            <StatCell value={walks} statType="BB" />
          </div>
        </div>
      );
    };

    const StatSummaryRow = ({ compact = false }) => {
      return (
        <div
          role="note"
          aria-label="스코어보드 범례: H 안타, E 에러, BB 볼넷, 노란색 셀은 현재 이닝"
          className="flex items-center gap-4 sm:gap-6 px-3 py-2"
        >
          <div className="flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full bg-green-400 shrink-0"></span>
            <span className="text-xs text-gray-400">H 안타</span>
          </div>
          <div className="flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full bg-red-400 shrink-0"></span>
            <span className="text-xs text-gray-400">E 에러</span>
          </div>
          <div className="flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full bg-blue-400 shrink-0"></span>
            <span className="text-xs text-gray-400">BB 볼넷</span>
          </div>
          <div className="flex items-center gap-1.5 ml-auto">
            <span className="w-3 h-3 rounded-sm bg-yellow-400 shrink-0"></span>
            <span className="text-xs text-gray-400">현재 이닝</span>
          </div>
        </div>
      );
    };

    const ScoreboardLegend = ({ lastUpdated }) => {
      return (
        <div
          role="complementary"
          aria-label="스코어보드 부가 정보"
          className="flex items-center justify-between flex-wrap gap-2 px-3 py-2 border-t border-gray-800 bg-gray-900/50"
        >
          <StatSummaryRow />
          {lastUpdated && (
            <span className="text-xs text-gray-600 ml-auto">{lastUpdated}</span>
          )}
        </div>
      );
    };

    // Organisms
    const ScoreboardHeader = ({
      homeTeam,
      awayTeam,
      gameStatus,
      currentInning,
      inningHalf,
      venue,
      gameDate,
    }) => {
      return (
        <div
          role="banner"
          aria-label={`경기 헤더 — ${awayTeam.name} vs ${homeTeam.name} 현재 점수`}
          className="flex flex-col gap-3 sm:gap-4 px-4 sm:px-6 pt-4 sm:pt-6 pb-3 bg-gray-900 border-b border-gray-800"
        >
          <div className="flex items-center justify-between">
            <div className="flex flex-col gap-0.5">
              <span className="text-xs text-gray-500">{gameDate}</span>
              <span className="text-xs text-gray-600">{venue}</span>
            </div>
            <GameStatusBadge
              status={gameStatus}
              currentInning={currentInning}
              inningHalf={inningHalf}
            />
          </div>

          <div className="flex items-center justify-between gap-4 py-2">
            <div className="flex flex-col items-center gap-1.5 flex-1">
              <TeamAvatar
                initials={awayTeam.initials}
                teamColor={awayTeam.teamColor}
                logoSrc={awayTeam.logoSrc}
                size="lg"
              />
              <span className="text-sm font-bold text-gray-200 text-center">
                {awayTeam.shortName}
              </span>
              <span className="text-4xl sm:text-5xl font-black tabular-nums text-white">
                {awayTeam.totalRuns ?? '-'}
              </span>
            </div>

            <div className="flex flex-col items-center gap-1 px-2">
              <span className="text-2xl font-black text-gray-600">:</span>
              <span className="text-xs text-gray-600 uppercase tracking-widest">
                VS
              </span>
            </div>

            <div className="flex flex-col items-center gap-1.5 flex-1">
              <TeamAvatar
                initials={homeTeam.initials}
                teamColor={homeTeam.teamColor}
                logoSrc={homeTeam.logoSrc}
                size="lg"
              />
              <span className="text-sm font-bold text-gray-200 text-center">
                {homeTeam.shortName}
              </span>
              <span className="text-4xl sm:text-5xl font-black tabular-nums text-white">
                {homeTeam.totalRuns ?? '-'}
              </span>
            </div>
          </div>
        </div>
      );
    };

    const ScoreboardTable = ({
      homeTeam,
      awayTeam,
      currentInning,
      gameStatus,
      totalInnings = 9,
    }) => {
      return (
        <div
          role="region"
          aria-label="이닝별 스코어보드 테이블"
          className="block w-full overflow-x-auto scrollbar-thin scrollbar-track-gray-900 scrollbar-thumb-gray-700"
        >
          <table
            role="table"
            aria-label="이닝별 점수 테이블"
            className="min-w-max w-full border-collapse"
          >
            <thead>
              <tr>
                <td>
                  <InningHeaderRow
                    totalInnings={totalInnings}
                    currentInning={currentInning}
                  />
                </td>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <InningScoreRow
                    teamName={awayTeam.name}
                    teamShortName={awayTeam.shortName}
                    initials={awayTeam.initials}
                    teamColor={awayTeam.teamColor}
                    logoSrc={awayTeam.logoSrc}
                    scores={awayTeam.scores}
                    totalRuns={awayTeam.totalRuns}
                    hits={awayTeam.hits}
                    errors={awayTeam.errors}
                    walks={awayTeam.walks}
                    currentInning={currentInning}
                    isWinning={awayTeam.totalRuns > homeTeam.totalRuns}
                    totalInnings={totalInnings}
                  />
                </td>
              </tr>
              <tr>
                <td>
                  <InningScoreRow
                    teamName={homeTeam.name}
                    teamShortName={homeTeam.shortName}
                    initials={homeTeam.initials}
                    teamColor={homeTeam.teamColor}
                    logoSrc={homeTeam.logoSrc}
                    scores={homeTeam.scores}
                    totalRuns={homeTeam.totalRuns}
                    hits={homeTeam.hits}
                    errors={homeTeam.errors}
                    walks={homeTeam.walks}
                    currentInning={currentInning}
                    isWinning={homeTeam.totalRuns > awayTeam.totalRuns}
                    totalInnings={totalInnings}
                  />
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      );
    };

    const ScoreboardFooter = ({ lastUpdated, broadcastChannel }) => {
      return (
        <div
          role="contentinfo"
          aria-label="스코어보드 하단 정보"
          className="flex flex-col gap-1 bg-gray-900 rounded-b-2xl overflow-hidden"
        >
          <ScoreboardLegend lastUpdated={lastUpdated} />
          {broadcastChannel && (
            <div className="flex items-center justify-between px-3 pb-3 gap-2">
              <span className="text-xs text-gray-600">
                📺 {broadcastChannel} 중계
              </span>
            </div>
          )}
        </div>
      );
    };

    // Templates
    const ScoreboardTemplate = ({
      header,
      table,
      footer,
      isLoading = false,
    }) => {
      return (
        <div
          role="region"
          aria-label="야구 경기 스코어보드"
          className="flex flex-col w-full max-w-3xl mx-auto bg-gray-900 rounded-2xl shadow-2xl overflow-hidden border border-gray-800"
        >
          <div className="w-full flex-shrink-0">{header}</div>
          <div className="relative">
            <div className="w-full">{table}</div>
            {isLoading && (
              <div className="absolute inset-0 bg-gray-900/70 backdrop-blur-sm flex items-center justify-center z-20 animate-pulse">
                <span className="text-gray-400 text-sm">데이터 불러오는 중...</span>
              </div>
            )}
          </div>
          <div className="w-full flex-shrink-0">{footer}</div>
        </div>
      );
    };

    // Pages
    const ScoreboardPage = ({ gameId }) => {
      const [pageState, setPageState] = useState('loading');
      const [gameData, setGameData] = useState(null);

      const fetchGameData = () => {
        setPageState('loading');
        // Mock API Call
        setTimeout(() => {
          const mockData = {
            gameStatus: 'live',
            currentInning: 6,
            inningHalf: 'bottom',
            gameDate: '2026.03.12',
            venue: '잠실야구장',
            broadcastChannel: 'MBC Sports',
            lastUpdated: '14:35 기준',
            homeTeam: {
              name: 'LG 트윈스',
              shortName: 'LG',
              initials: 'LG',
              teamColor: '#C70039',
              scores: [0, 1, 0, 2, 0, null, null, null, null],
              totalRuns: 3,
              hits: 5,
              errors: 0,
              walks: 2,
            },
            awayTeam: {
              name: '키움 히어로즈',
              shortName: '키움',
              initials: 'KW',
              teamColor: '#800000',
              scores: [0, 0, 0, 0, 1, 0, null, null, null],
              totalRuns: 1,
              hits: 3,
              errors: 1,
              walks: 1,
            },
          };
          setGameData(mockData);
          setPageState(mockData.gameStatus);
        }, 1000);
      };

      useEffect(() => {
        fetchGameData();
      }, [gameId]);

      if (pageState === 'error') {
        return (
          <div className="flex-col items-center min-h-screen bg-gray-950 px-4 sm:px-6 py-6 sm:py-10 flex">
            <div className="w-full max-w-3xl mb-4 flex items-center justify-between">
              <button
                role="button"
                aria-label="경기 목록으로 돌아가기"
                className="flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-200 transition-colors"
              >
                ← 경기 목록
              </button>
              <span className="text-xs text-gray-600">KBO 리그</span>
            </div>
            <div className="w-full max-w-3xl flex flex-col items-center justify-center gap-4 py-20">
              <span className="text-5xl">⚾</span>
              <p className="text-gray-400 text-center">경기 정보를 불러올 수 없습니다.</p>
              <button
                role="button"
                aria-label="경기 데이터 다시 불러오기"
                onClick={fetchGameData}
                className="px-6 py-2 rounded-xl bg-gray-700 hover:bg-gray-600 text-gray-200 text-sm font-semibold transition-colors"
              >
                다시 시도
              </button>
            </div>
          </div>
        );
      }

      const isLoading = pageState === 'loading';

      return (
        <div
          role="main"
          aria-label="야구 경기 스코어보드 페이지"
          lang="ko"
          className="flex flex-col items-center min-h-screen bg-gray-950 px-4 sm:px-6 py-6 sm:py-10"
        >
          <div className="w-full max-w-3xl mb-4 flex items-center justify-between">
            <button
              role="button"
              aria-label="경기 목록으로 돌아가기"
              className="flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-200 transition-colors"
            >
              ← 경기 목록
            </button>
            <span className="text-xs text-gray-600">KBO 리그</span>
          </div>

          <ScoreboardTemplate
            isLoading={isLoading}
            header={
              gameData ? (
                <ScoreboardHeader
                  homeTeam={gameData.homeTeam}
                  awayTeam={gameData.awayTeam}
                  gameStatus={gameData.gameStatus}
                  currentInning={gameData.currentInning}
                  inningHalf={gameData.inningHalf}
                  venue={gameData.venue}
                  gameDate={gameData.gameDate}
                />
              ) : (
                <div className="h-[140px] bg-gray-900 border-b border-gray-800" />
              )
            }
            table={
              gameData ? (
                <ScoreboardTable
                  homeTeam={gameData.homeTeam}
                  awayTeam={gameData.awayTeam}
                  currentInning={gameData.currentInning}
                  gameStatus={gameData.gameStatus}
                  totalInnings={9}
                />
              ) : (
                <div className="h-[120px] bg-gray-900" />
              )
            }
            footer={
              gameData ? (
                <ScoreboardFooter
                  lastUpdated={gameData.lastUpdated}
                  broadcastChannel={gameData.broadcastChannel}
                />
              ) : (
                <div className="h-[48px] bg-gray-900 rounded-b-2xl" />
              )
            }
          />
        </div>
      );
    };

    // App Wrapper
    const App = () => {
      return <ScoreboardPage gameId="test-game-123" />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
