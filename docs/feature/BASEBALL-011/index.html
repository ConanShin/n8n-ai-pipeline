  <script type="text/babel" data-type="module" data-presets="react,typescript">
    
const { useState, useEffect, useCallback, useRef } = React;

// --- atoms/PitchBall.tsx ---


const PitchBall = ({ speedMs, isActive, hitQuality }) => {
  const [style, setStyle] = useState({});
  
  useEffect(() => {
    if (isActive) {
      setStyle({
        transition: `transform ${speedMs}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`,
        transform: 'translateX(0)', // Start at 0, moving left
        right: '0%', // Start right edge
      });
      // Need a small timeout to trigger transition if we start from off-screen
      const timer = setTimeout(() => {
        setStyle({
          transition: `transform ${speedMs}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`,
          transform: 'translateX(-100vw)', // Or whatever point
          right: '0%',
        });
      }, 50);
      return () => clearTimeout(timer);
    } else {
      setStyle({ transform: 'translateX(0)', right: '-50px', transition: 'none' }); // Reset
    }
  }, [isActive, speedMs]);

  // Handle hit state styling
  let variantClasses = "bg-white border-4 border-gray-200 shadow-white/30";
  if (hitQuality === 'perfect') {
    variantClasses = "bg-yellow-300 border-4 border-yellow-400 shadow-yellow-300/60 scale-125 opacity-0 transition-all duration-200 ease-out";
  } else if (hitQuality === 'good') {
    variantClasses = "bg-green-300 border-4 border-green-400 shadow-green-300/40 scale-150 opacity-0 transition-all duration-200 ease-out";
  } else if (hitQuality === 'miss') {
    variantClasses = "bg-gray-400 border-4 border-gray-500 opacity-40 transition-opacity duration-300";
  }

  if (!isActive && !hitQuality) return null;

  return (
    <div
      role="img"
      aria-label="날아오는 야구공"
      aria-hidden="true"
      className={`absolute w-10 h-10 sm:w-12 sm:h-12 rounded-full shadow-xl pointer-events-none select-none flex items-center justify-center top-1/2 -translate-y-1/2 ${variantClasses}`}
      style={style}
    />
  );
};

// --- atoms/SwingResultLabel.tsx ---


const SwingResultLabel = ({ result, visible }) => {
  const [show, setShow] = useState(visible);

  useEffect(() => {
    setShow(visible);
  }, [visible]);

  if (!show) return null;

  let classes = "";
  let label = "";

  switch (result) {
    case 'homerun':
      classes = "text-yellow-300 text-5xl sm:text-7xl font-black tracking-tight drop-shadow-[0_0_20px_rgba(253,224,71,0.9)] animate-[resultPop_250ms_spring_forwards,fadeOut_800ms_ease-in_forwards]";
      label = "🏆 홈런!";
      break;
    case 'triple':
      classes = "text-orange-400 text-4xl sm:text-6xl font-black tracking-tight drop-shadow-lg animate-[resultPop_200ms_forwards,fadeOut_700ms_ease-in_forwards]";
      label = "🔥 3루타!";
      break;
    case 'double':
      classes = "text-green-400 text-4xl sm:text-5xl font-black tracking-tight drop-shadow-lg animate-[resultPop_200ms_forwards,fadeOut_700ms_ease-in_forwards]";
      label = "⚡ 2루타!";
      break;
    case 'single':
      classes = "text-blue-300 text-3xl sm:text-4xl font-black tracking-tight drop-shadow animate-[resultPop_180ms_forwards,fadeOut_600ms_ease-in_forwards]";
      label = "✅ 1루타!";
      break;
    case 'strike':
      classes = "text-red-400 text-3xl sm:text-4xl font-black tracking-tight drop-shadow animate-[strikeShake_300ms_forwards,fadeOut_500ms_ease-in_forwards]";
      label = "✕ 스트라이크";
      break;
  }

  return (
    <div className={`absolute inset-0 flex items-center justify-center pointer-events-none z-30 select-none ${visible ? 'opacity-100' : 'opacity-0'}`}>
      <div 
        role="alert" 
        aria-live="assertive" 
        aria-label={`스윙 판정: ${result}`}
        className={classes}
      >
        {label}
      </div>
      <style>{`
        @keyframes resultPop {
          0% { transform: scale(0); }
          80% { transform: scale(1.1); }
          100% { transform: scale(1); }
        }
        @keyframes strikeShake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-8px); }
          50% { transform: translateX(8px); }
          75% { transform: translateX(-8px); }
        }
        @keyframes fadeOut {
          0%, 60% { opacity: 1; }
          100% { opacity: 0; }
        }
      `}</style>
    </div>
  );
};

// --- atoms/StrikeIndicator.tsx ---


const StrikeIndicator = ({ used, index }) => {
  return (
    <div
      role="img"
      aria-label={`${used ? '사용된 기회' : '남은 기회'} ${index + 1}번째`}
      className={`w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 flex items-center justify-center transition-all duration-300 ${
        used 
          ? 'border-red-500 bg-red-500 shadow-red-500/50 shadow-md scale-110' 
          : 'border-gray-600 bg-transparent'
      }`}
    />
  );
};

// --- atoms/ScoreBadge.tsx ---


const ScoreBadge = ({ score, animated = false }) => {
  const [animate, setAnimate] = useState(false);

  useEffect(() => {
    if (animated) {
      setAnimate(true);
      const timer = setTimeout(() => setAnimate(false), 300);
      return () => clearTimeout(timer);
    }
  }, [score, animated]);

  return (
    <div 
      className="flex flex-col items-center gap-0.5"
      role="status"
      aria-live="polite"
      aria-label={`현재 점수 ${score}점`}
    >
      <span className="text-xs font-semibold uppercase tracking-widest text-gray-400">SCORE</span>
      <span className={`text-4xl sm:text-5xl font-black tabular-nums transition-transform duration-200 ${
        animate ? 'scale-125 text-yellow-300' : 'text-white scale-100'
      }`}>
        {score}
      </span>
    </div>
  );
};

// --- atoms/CountdownTimer.tsx ---


const CountdownTimer = ({ count, visible }) => {
  const [key, setKey] = useState(0);

  useEffect(() => {
    setKey(prev => prev + 1);
  }, [count]);

  if (!visible) return null;

  return (
    <div className="absolute inset-0 flex items-center justify-center z-40 pointer-events-none">
      <span 
        key={key}
        className="text-8xl sm:text-9xl font-black text-white drop-shadow-[0_0_40px_rgba(255,255,255,0.6)] select-none animate-[countdownScale_900ms_ease-in-out_forwards]"
        role="timer"
        aria-live="assertive"
        aria-label={`게임 시작까지 ${count}`}
      >
        {count}
      </span>
      <style>{`
        @keyframes countdownScale {
          0% { transform: scale(0); opacity: 0; }
          20% { transform: scale(1); opacity: 1; }
          80% { transform: scale(1); opacity: 1; }
          100% { transform: scale(1.5); opacity: 0; }
        }
      `}</style>
    </div>
  );
};

// --- atoms/TapButton.tsx ---


const TapButton = ({ disabled = false, onTap }) => {
  const [pressed, setPressed] = useState(false);

  const handlePointerDown = (e) => {
    if (disabled) return;
    setPressed(true);
    onTap();
  };

  const handlePointerUp = () => {
    if (disabled) return;
    setPressed(false);
  };

  const handleKeyDown = (e) => {
    if (disabled) return;
    if (e.key === ' ' || e.key === 'Enter') {
      setPressed(true);
      onTap();
    }
  };

  const handleKeyUp = (e) => {
    if (disabled) return;
    if (e.key === ' ' || e.key === 'Enter') {
      setPressed(false);
    }
  };

  let classes = "relative w-36 h-36 sm:w-44 sm:h-44 rounded-full flex items-center justify-center cursor-pointer select-none touch-none ";
  
  if (disabled) {
    classes += "bg-gray-700 border-gray-600 opacity-50 cursor-not-allowed shadow-none";
  } else if (pressed) {
    classes += "scale-90 bg-gradient-to-br from-amber-300 to-orange-400 shadow-md shadow-orange-400/30";
  } else {
    classes += "bg-gradient-to-br from-amber-400 to-orange-500 shadow-2xl shadow-orange-500/50 border-4 border-amber-300 active:scale-95 transition-transform duration-75";
  }

  return (
    <div
      role="button"
      aria-label="배트 휘두르기 — 탭하여 공을 치세요"
      aria-disabled={disabled}
      className={classes}
      onPointerDown={handlePointerDown}
      onPointerUp={handlePointerUp}
      onPointerLeave={handlePointerUp}
      onKeyDown={handleKeyDown}
      onKeyUp={handleKeyUp}
      tabIndex={disabled ? -1 : 0}
    >
      {pressed && !disabled && (
        <div className="absolute inset-0 rounded-full bg-white/30 animate-ping" />
      )}
      <span className="text-white text-2xl sm:text-3xl font-black tracking-tight drop-shadow">
        ⚾ HIT!
      </span>
    </div>
  );
};

// --- atoms/HitZoneBar.tsx ---



const HitZoneBar = ({ 
  ballProgress, 
  perfectWindow, 
  goodWindow, 
  visible = true 
}) => {
  if (!visible) return null;

  const getStyle = (window) => {
    const left = `${window.start * 100}%`;
    const width = `${(window.end - window.start) * 100}%`;
    return { left, width };
  };

  const ballLeft = `${Math.min(Math.max(ballProgress * 100, 0), 100)}%`;

  return (
    <div 
      role="progressbar"
      aria-label="공 타이밍 게이지"
      aria-valuenow={Math.round(ballProgress * 100)}
      aria-valuemin={0}
      aria-valuemax={100}
      className="relative w-full h-3 sm:h-4 rounded-full overflow-hidden bg-gray-800"
    >
      {/* Good Zone */}
      <div 
        className="absolute h-full bg-green-500/40 rounded-full transition-all duration-75"
        style={getStyle(goodWindow)}
      />
      {/* Perfect Zone */}
      <div 
        className="absolute h-full bg-yellow-400/70 rounded-full transition-all duration-75"
        style={getStyle(perfectWindow)}
      />
      {/* Ball Marker */}
      <div 
        className="absolute top-0 bottom-0 w-1 bg-white rounded-full shadow-white/80 shadow-md transition-all duration-75 -translate-x-1/2"
        style={{ left: ballLeft }}
      />
    </div>
  );
};

// --- molecules/StrikeCounter.tsx ---


const StrikeCounter = ({ usedCount, maxCount = 3 }) => {
  const isLastChance = usedCount === maxCount - 1;

  return (
    <div 
      className="flex flex-col items-center gap-1.5"
      role="status"
      aria-label={`남은 기회 ${maxCount - usedCount}번`}
    >
      <span className={`text-xs font-semibold uppercase tracking-widest ${isLastChance ? 'text-red-400 animate-pulse' : 'text-gray-400'}`}>
        STRIKES
      </span>
      <div className="flex items-center gap-2">
        {Array.from({ length: maxCount }).map((_, i) => (
          <StrikeIndicator key={i} index={i} used={i < usedCount} />
        ))}
      </div>
    </div>
  );
};

// --- molecules/ScoreDisplay.tsx ---


const ScoreDisplay = ({ score, bestScore, scoreUpdated = false }) => {
  return (
    <div 
      className="flex flex-col items-center gap-1"
      role="region"
      aria-label="점수 현황"
    >
      <ScoreBadge score={score} animated={scoreUpdated} />
      {bestScore !== undefined && (
        <span className="text-xs text-gray-600 tabular-nums">
          BEST {bestScore}
        </span>
      )}
    </div>
  );
};

// --- molecules/ResultOverlay.tsx ---


const ResultOverlay = ({ result, timing, visible }) => {
  if (!visible) return null;

  const timingText = timing === 'perfect' ? '🎯 Perfect Timing!' :
                     timing === 'good' ? '👍 Good!' :
                     timing === 'early' ? '⬅ Too Early' :
                     timing === 'late' ? '➡ Too Late' : '';

  return (
    <div 
      className="absolute inset-0 flex flex-col items-center justify-center gap-3 z-30 pointer-events-none"
      role="alert"
      aria-live="assertive"
      aria-label={`판정 결과: ${result}`}
    >
      <div className="relative w-full flex items-center justify-center">
         <SwingResultLabel result={result} visible={visible} />
      </div>
      {!!timing && result !== 'strike' && (
        <span className="text-base sm:text-lg font-bold text-white/80 tracking-wide drop-shadow animate-[resultPop_200ms_forwards,fadeOut_700ms_ease-in_forwards] mt-24">
          {timingText}
        </span>
      )}
    </div>
  );
};

// --- molecules/PitchLane.tsx ---


const PitchLane = ({
  ballSpeedMs,
  isActive,
  ballProgress,
  hitQuality,
  perfectWindow,
  goodWindow
}) => {
  return (
    <div 
      className="relative w-full flex-1 flex flex-col overflow-hidden"
      role="region"
      aria-label="투구 레인"
    >
      {/* Background Guideline */}
      <div className="absolute inset-0 flex items-center">
        <div className="w-full h-px bg-gradient-to-r from-transparent via-gray-600/40 to-transparent" />
      </div>

      {/* Batter Silhouette */}
      <div className="absolute top-1/2 -translate-y-1/2 left-8 sm:left-12 z-0">
        <span className="text-4xl sm:text-5xl select-none" aria-hidden="true" style={{ transform: 'scaleX(-1)', display: 'inline-block' }}>
          🏏
        </span>
      </div>

      {/* The Ball */}
      <PitchBall 
        speedMs={ballSpeedMs} 
        isActive={isActive} 
        hitQuality={hitQuality} 
      />

      {/* Hit Zone Indicator at bottom */}
      <div className="absolute bottom-2 left-4 right-4 z-10">
        <HitZoneBar 
          ballProgress={ballProgress} 
          perfectWindow={perfectWindow} 
          goodWindow={goodWindow} 
        />
      </div>
    </div>
  );
};

// --- molecules/GameControlBar.tsx ---


const GameControlBar = ({
  isPaused,
  isMuted,
  onPause,
  onRestart,
  onMute
}) => {
  return (
    <div 
      className="flex items-center justify-between w-full px-4 py-2"
      role="toolbar"
      aria-label="게임 컨트롤"
    >
      <button 
        onClick={onPause}
        className="w-9 h-9 flex items-center justify-center rounded-full bg-gray-800/60 hover:bg-gray-700/80 text-gray-300 hover:text-white transition-colors text-lg"
        role="button"
        aria-label={isPaused ? '게임 재개' : '게임 일시정지'}
      >
        {isPaused ? '▶' : '⏸'}
      </button>

      <span className="text-sm font-bold text-gray-300 tracking-widest uppercase">
        BASEBALL-011
      </span>

      <button 
        onClick={onMute}
        className="w-9 h-9 flex items-center justify-center rounded-full bg-gray-800/60 hover:bg-gray-700/80 text-gray-300 hover:text-white transition-colors text-lg"
        role="button"
        aria-label={isMuted ? '소리 켜기' : '음소거'}
      >
        {isMuted ? '🔇' : '🔊'}
      </button>
    </div>
  );
};

// --- organisms/BattingField.tsx ---


const BattingField = ({
  gamePhase,
  ballSpeedMs,
  ballProgress,
  lastResult,
  lastTiming,
  perfectWindow,
  goodWindow,
  onSwing,
  countdownValue = 3
}) => {
  const isPitchingPhase = gamePhase === 'pitching' || gamePhase === 'swinging' || gamePhase === 'showing-result';
  const showResult = gamePhase === 'showing-result' && !!lastResult;

  return (
    <div 
      className="relative flex-1 flex flex-col items-center justify-end gap-6 pb-8 sm:pb-10 overflow-hidden"
      role="main"
      aria-label="배팅 필드 — 공이 날아오면 탭하여 배트를 휘두르세요"
    >
      <PitchLane 
        ballSpeedMs={ballSpeedMs}
        isActive={isPitchingPhase}
        ballProgress={ballProgress}
        hitQuality={lastTiming === 'early' || lastTiming === 'late' ? 'good' : lastTiming}
        perfectWindow={perfectWindow}
        goodWindow={goodWindow}
      />

      <div className="z-20 relative">
        <TapButton 
          onTap={onSwing} 
          disabled={gamePhase !== 'pitching'}
        />
      </div>

      <ResultOverlay 
        result={lastResult || 'strike'} 
        timing={lastTiming} 
        visible={showResult} 
      />

      <CountdownTimer 
        count={countdownValue} 
        visible={gamePhase === 'countdown'} 
      />
    </div>
  );
};

// --- organisms/GameHUD.tsx ---


const GameHUD = ({
  score,
  bestScore,
  strikeCount,
  scoreUpdated,
  isPaused,
  isMuted,
  onPause,
  onRestart,
  onMute
}) => {
  return (
    <div 
      className="flex flex-col w-full"
      role="region"
      aria-label="게임 현황 HUD"
    >
      <GameControlBar 
        isPaused={isPaused}
        isMuted={isMuted}
        onPause={onPause}
        onRestart={onRestart}
        onMute={onMute}
      />
      <div className="flex items-start justify-between px-6 py-3">
        <ScoreDisplay score={score} bestScore={bestScore} scoreUpdated={scoreUpdated} />
        <StrikeCounter usedCount={strikeCount} maxCount={3} />
      </div>
    </div>

};

      aria-modal="true"

          </p>

      <div className="w-full max-w-xs grid grid-cols-5 gap-2 bg-gray-900 rounded-2xl p-4">
        {[
          { emoji: '🏆', value: hitSummary.homerun, label: '홈런', color: 'text-yellow-300' },
          { emoji: '🔥', value: hitSummary.triple, label: '3루타', color: 'text-orange-400' },
          { emoji: '⚡', value: hitSummary.double, label: '2루타', color: 'text-green-400' },
          { emoji: '✅', value: hitSummary.single, label: '1루타', color: 'text-blue-300' },
          { emoji: '✕', value: hitSummary.strike, label: '스트라이크', color: 'text-red-400' },
        ].map(item => (
          <div key={item.label} className="flex flex-col items-center gap-1">
            <span className="text-xl">{item.emoji}</span>
            <span className={`text-lg font-black ${item.color}`}>{item.value}</span>
            <span className="text-[10px] sm:text-xs text-gray-500">{item.label}</span>

      <div className="flex flex-col gap-3 w-full max-w-xs">

            🏠 홈으로

        @keyframes slideUp {
          from { transform: translateY(100%); }
          to { transform: translateY(0%); }
        }
      `}</style>
    </div>
  );
};

// --- organisms/ReadyCountdown.tsx ---


const ReadyCountdown = ({ onCountdownEnd, visible }) => {
  const [count, setCount] = useState(3);
  const [phase, setPhase] = useState('showing-guide');

  useEffect(() => {
    if (visible) {
      setPhase('showing-guide');
      setCount(3);
    }
  }, [visible]);

  useEffect(() => {
    if (visible && phase === 'counting-down') {
      const seq = [3, 2, 1, 'GO!'];
      let idx = 0;
      
      const timer = setInterval(() => {
        idx++;
        if (idx < seq.length) {
          setCount(seq[idx]);
        } else {
          clearInterval(timer);
          onCountdownEnd();
        }
      }, 900);

      return () => clearInterval(timer);
    }
  }, [visible, phase, onCountdownEnd]);

  if (!visible) return null;

  return (
    <div 
      className="absolute inset-0 flex flex-col items-center justify-center gap-6 bg-gray-950/80 backdrop-blur-sm z-40"
      role="dialog"
      aria-label="게임 시작 준비"
      aria-live="polite"
    >
      {phase === 'showing-guide' ? (
        <div 
          className="flex flex-col items-center gap-2 text-center px-6 animate-[fadeIn_300ms_ease-in]"
          onClick={() => setPhase('counting-down')}
          style={{ cursor: 'pointer' }}
        >
          <span className="text-5xl mb-2">⚾</span>
          <p className="text-xl sm:text-2xl font-black text-white">공이 오면 탭하세요!</p>
          <p className="text-sm text-gray-400 mt-1">타이밍에 따라 홈런 · 안타 · 스트라이크가 결정됩니다</p>
          
          <div className="flex gap-4 mt-4 flex-wrap justify-center">
            <div className="flex items-center gap-1.5">
              <span className="w-3 h-3 rounded-full bg-yellow-400 shrink-0" />
              <span className="text-xs text-gray-300">Perfect → 홈런</span>
            </div>
            <div className="flex items-center gap-1.5">
              <span className="w-3 h-3 rounded-full bg-green-400 shrink-0" />
              <span className="text-xs text-gray-300">Good → 안타</span>
            </div>
            <div className="flex items-center gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-400 shrink-0" />
              <span className="text-xs text-gray-300">Miss → 스트라이크</span>
            </div>
          </div>
          
          <button className="mt-8 px-8 py-3 bg-amber-500 text-white font-bold rounded-full shadow-lg shadow-amber-500/30 animate-pulse">
            화면을 탭하여 시작
          </button>
        </div>
      ) : (
        <CountdownTimer count={count} visible={true} />
      )}
    </div>
  );
};

// --- pages/BaseballGamePage.tsx ---



const TIMING_WINDOWS = {
  easy:   { perfect: { start: 0.42, end: 0.58 }, good: { start: 0.34, end: 0.66 } },
  normal: { perfect: { start: 0.46, end: 0.54 }, good: { start: 0.38, end: 0.62 } },
  hard:   { perfect: { start: 0.48, end: 0.52 }, good: { start: 0.43, end: 0.57 } },
};

const getPitchSpeed = (pitchCount) => {
  if (pitchCount === 0) return 1400;
  if (pitchCount === 1) return 1200;
  if (pitchCount === 2) return 1000;
  return 850;
};

const BaseballGamePage = ({ difficulty = 'normal' }) => {
  const [phase, setPhase] = useState('idle');
  const [score, setScore] = useState(0);
  const [bestScore, setBestScore] = useState(0);
  const [strikeCount, setStrikeCount] = useState(0);
  const [pitchCount, setPitchCount] = useState(0);
  const [ballProgress, setBallProgress] = useState(0);
  const [isMuted, setIsMuted] = useState(false);
  const [scoreUpdated, setScoreUpdated] = useState(false);
  
  const [lastResult, setLastResult] = useState(null);
  const [lastTiming, setLastTiming] = useState(null);
  const [isNewRecord, setIsNewRecord] = useState(false);
  const [hitSummary, setHitSummary] = useState({
    homerun: 0, triple: 0, double: 0, single: 0, strike: 0
  });

  const timerRef = useRef(null);
  const pitchStartTimeRef = useRef(0);

  const currentWindow = TIMING_WINDOWS[difficulty];
  const ballSpeedMs = getPitchSpeed(pitchCount);

  // Ball progress update loop
  useEffect(() => {
    if (phase === 'pitching') {
      pitchStartTimeRef.current = Date.now();
      
      const updateProgress = () => {
        const elapsed = Date.now() - pitchStartTimeRef.current;
        const progress = elapsed / ballSpeedMs;
        setBallProgress(progress);

        if (progress > 1.2) { // Past screen without swing
           handleSwing(true); // force miss
        } else {
           timerRef.current = requestAnimationFrame(updateProgress);
        }
      };
      
      timerRef.current = requestAnimationFrame(updateProgress);
      return () => {
        if (timerRef.current) cancelAnimationFrame(timerRef.current);
      };
    } else if (phase === 'paused') {
      // Pause animation
    } else if (phase !== 'swinging' && phase !== 'showing-result') {
      setBallProgress(0);
    }
  }, [phase, ballSpeedMs]);

  const handleSwing = useCallback((forceMiss = false) => {
    if (phase !== 'pitching') return;
    setPhase('swinging');

    if (timerRef.current) cancelAnimationFrame(timerRef.current);

    let result = 'strike';
    let timing = null;
    let points = 0;

    if (!forceMiss) {
      const p = ballProgress;
      const { perfect, good } = currentWindow;
      
      if (p >= perfect.start && p <= perfect.end) {
        result = 'homerun';
        timing = 'perfect';
        points = 400;
      } else if (p >= good.start && p <= good.end) {
        // Good timing - break it down
        const perfectCenter = (perfect.start + perfect.end) / 2;
        const distance = Math.abs(p - perfectCenter);
        const maxGoodDistance = (good.end - good.start) / 2;
        const ratio = distance / maxGoodDistance; // 0 to 1

        timing = p < perfect.start ? 'early' : 'late';

        if (ratio < 0.6) {
          result = 'triple';
          points = 200;
        } else if (ratio < 0.85) {
          result = 'double';
          points = 100;
        } else {
          result = 'single';
          points = 50;
        }
      } else {
        result = 'strike';
        timing = p < good.start ? 'early' : 'late';
        points = 0;
      }
    } else {
      result = 'strike';
      timing = 'late';
      points = 0;
    }

    setLastResult(result);
    setLastTiming(timing);
    setHitSummary(prev => ({ ...prev, [result]: prev[result] + 1 }));

    if (points > 0) {
      setScore(s => {
        const newScore = s + points;
        if (newScore > bestScore) {
          setBestScore(newScore);
          setIsNewRecord(true);
        }
        return newScore;
      });
      setScoreUpdated(true);
      setTimeout(() => setScoreUpdated(false), 300);
    }

    setPhase('showing-result');

    setTimeout(() => {
      if (result === 'strike') {
        setStrikeCount(s => {
          const nextS = s + 1;
          if (nextS >= 3) {
            setPhase('game-over');
            return nextS;
          }
          setPhase('pitching');
          setPitchCount(p => p + 1);
          return nextS;
        });
      } else {
        setPhase('pitching');
        setPitchCount(p => p + 1);
      }
    }, 1000);
    
  }, [phase, ballProgress, currentWindow, bestScore]);

  const startGame = () => {
    setPhase('countdown');
    setScore(0);
    setStrikeCount(0);
    setPitchCount(0);
    setIsNewRecord(false);
    setHitSummary({ homerun: 0, triple: 0, double: 0, single: 0, strike: 0 });
  };

  useEffect(() => {
    if (phase === 'idle') {
      setPhase('countdown');
    }
  }, []);

  return (
    <GameTemplate 
      hud={
        <GameHUD 
          score={score}
          bestScore={bestScore}
          strikeCount={strikeCount}
          scoreUpdated={scoreUpdated}
          isPaused={phase === 'paused'}
          isMuted={isMuted}
          onPause={() => phase === 'pitching' ? setPhase('paused') : (phase === 'paused' ? setPhase('pitching') : null)}
          onRestart={startGame}
          onMute={() => setIsMuted(!isMuted)}
        />
      }
      field={
        <BattingField 
          gamePhase={phase}
          ballSpeedMs={ballSpeedMs}
          ballProgress={ballProgress}
          lastResult={lastResult}
          lastTiming={lastTiming}
          perfectWindow={currentWindow.perfect}
          goodWindow={currentWindow.good}
          onSwing={handleSwing}
        />
      }
      overlay={
        <>
          <ReadyCountdown 
            visible={phase === 'countdown'}
            onCountdownEnd={() => setPhase('pitching')}
          />
          <GameOverPanel 
            visible={phase === 'game-over'}
            finalScore={score}
            isNewRecord={isNewRecord}
            hitSummary={hitSummary}
            onRestart={startGame}
          />
        </>
      }
    />
  );
};


    const App = () => {
      return <BaseballGamePage difficulty="normal" />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
