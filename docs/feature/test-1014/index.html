<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview - TEST-1014</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- ATOMS ---
    const Button = ({ 
      label, 
      type = 'button', 
      disabled = false, 
      isLoading = false,
      ...props 
    }) => {
      return (
        <button
          type={type}
          disabled={disabled || isLoading}
          className={`w-full flex items-center justify-center py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 ${
            (disabled || isLoading) ? 'opacity-50 cursor-not-allowed' : ''
          }`}
          role="button"
          aria-label="Submit Button"
          {...props}
        >
          {isLoading ? (
            <span className="animate-spin inline-block w-5 h-5 border-2 border-current border-t-transparent text-white rounded-full" role="status" aria-label="loading"></span>
          ) : (
            label
          )}
        </button>
      );
    };

    const Divider = () => {
      return (
        <div 
          className="flex items-center w-full gap-3 text-sm text-gray-500 before:flex-1 before:border-t before:border-gray-300 after:flex-1 after:border-t after:border-gray-300"
          role="separator"
          aria-label="Divider"
        >
          or
        </div>
      );
    };

    const SocialLoginButton = ({ provider, icon, ...props }) => {
      return (
        <button
          type="button"
          className="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-white border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-colors focus:ring-2 focus:ring-gray-200 disabled:opacity-50 disabled:cursor-not-allowed"
          role="button"
          aria-label={`Login with ${provider}`}
          {...props}
        >
          {icon === 'google' && (
            <svg className="w-5 h-5" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
          )}
          {icon === 'github' && (
            <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          )}
          Continue with {provider}
        </button>
      );
    };

    // --- MOLECULES ---
    const InputField = ({
      label,
      type,
      id,
      placeholder,
      error,
      disabled,
      ...props
    }) => {
      return (
        <div className="flex flex-col gap-1.5" role="textbox" aria-label="Input Field">
          <label htmlFor={id} className={`text-sm font-medium ${disabled ? 'text-gray-400' : 'text-gray-700'}`}>
            {label}
          </label>
          <input
            id={id}
            type={type}
            placeholder={placeholder}
            disabled={disabled}
            className={`w-full px-3 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 sm:text-sm transition-colors ${
              error 
                ? 'border-red-300 focus:ring-red-500 focus:border-red-500' 
                : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500'
            } ${disabled ? 'bg-gray-50 text-gray-500 cursor-not-allowed' : 'bg-white'}`}
            {...props}
          />
          {error && <span className="text-xs text-red-500">{error}</span>}
        </div>
      );
    };

    // --- ORGANISMS ---
    const LoginForm = ({ onSubmit }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email || !password) {
          setError('Please fill in all fields');
          return;
        }
        setError('');
        setIsLoading(true);
        
        // Simulate API call
        setTimeout(() => {
          setIsLoading(false);
          onSubmit(e);
        }, 1500);
      };

      const handleSocialLogin = (provider) => {
        setIsLoading(true);
        setTimeout(() => {
          setIsLoading(false);
          alert(`Initiated OAuth flow for ${provider}`);
        }, 1000);
      }

      return (
        <form 
          onSubmit={handleSubmit}
          className="w-full max-w-md flex flex-col gap-6 bg-white p-8 rounded-xl shadow-md"
          role="form"
          aria-label="Login Form"
        >
          <div className="text-center">
            <h2 className="text-2xl font-bold text-gray-900">Welcome back</h2>
            <p className="text-sm text-gray-500 mt-2">Please enter your details to sign in.</p>
          </div>

          {error && (
            <div className="p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200">
              {error}
            </div>
          )}

          <div className="flex flex-col gap-4">
            <InputField
              id="email"
              label="Email address"
              type="email"
              placeholder="Enter your email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              disabled={isLoading}
            />
            <InputField
              id="password"
              label="Password"
              type="password"
              placeholder="••••••••"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              disabled={isLoading}
            />
          </div>

          <div className="flex items-center justify-between text-sm">
            <label className="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" className="rounded border-gray-300 text-blue-600 focus:ring-blue-500" disabled={isLoading} />
              <span className="text-gray-600">Remember me</span>
            </label>
            <a href="#" className="font-medium text-blue-600 hover:text-blue-500">Forgot password?</a>
          </div>

          <Button
            label="Sign in"
            type="submit"
            isLoading={isLoading}
          />

          <Divider />

          <div className="flex flex-col gap-3">
            <SocialLoginButton
              provider="Google"
              icon="google"
              disabled={isLoading}
              onClick={() => handleSocialLogin('Google')}
            />
            <SocialLoginButton
              provider="GitHub"
              icon="github"
              disabled={isLoading}
              onClick={() => handleSocialLogin('GitHub')}
            />
          </div>
        </form>
      );
    };

    // --- PAGES ---
    const LoginPage = () => {
      const handleLoginSubmit = (e) => {
        alert('Login successful!');
      };

      return (
        <main 
          className="min-h-screen w-full flex items-center justify-center bg-gray-50 p-4 sm:p-6 lg:p-8"
          role="main"
          aria-label="Login Page"
        >
          <LoginForm onSubmit={handleLoginSubmit} />
        </main>
      );
    };

    // --- APP ---
    const App = () => {
      return <LoginPage />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
