<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BASEBALL-008 Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes bounce { 0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); } 50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    @keyframes ping-once { 0% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes fade-scale-in { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes score-float { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-24px); opacity: 0; } }
    .animate-bounce { animation: bounce 1s infinite; }
    .animate-shake { animation: shake 0.5s infinite; }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .animate-ping-once { animation: ping-once 0.8s cubic-bezier(0, 0, 0.2, 1) forwards; }
    .animate-fade-scale-in { animation: fade-scale-in 0.15s ease-out forwards; }
    .animate-score-float { animation: score-float 0.6s ease-out forwards; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #030712; color: #ffffff; touch-action: none; overflow: hidden; }
    #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react,typescript">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    



const BallIcon = ({ size = 24, variant = 'active', className = '' }) => {
  const baseClasses = "rounded-full shrink-0 inline-block";
  const variants = {
    active: "bg-white border-2 border-gray-300 shadow-inner",
    used: "bg-red-500 border-2 border-red-700 opacity-80 shadow-inner",
    flying: "bg-white border-4 border-gray-200 shadow-xl"
  };
  
  return (
    <div 
      role="img" 
      aria-label="야구공"
      className={`${baseClasses} ${variants[variant]} ${className}`}
      style={{ width: size, height: size }}
    />
  );
};





const StrikeIndicatorDot = ({ isUsed, index }) => {
  const baseClasses = "inline-flex items-center justify-center w-7 h-7 rounded-full font-bold text-sm transition-all duration-300";
  const variants = {
    active: "bg-white border-2 border-gray-400 text-transparent",
    used: "bg-red-500 border-2 border-red-600 text-white scale-110 shadow-md"
  };

  return (
    <span
      role="img"
      aria-label={`${index + 1}번 기회 — ${isUsed ? '소진' : '남음'}`}
      className={`${baseClasses} ${isUsed ? variants.used : variants.active}`}
    >
      {isUsed ? '✕' : ''}
    </span>
  );
};





const ScoreLabel = ({ result, size = 'md' }) => {
  const baseClasses = "inline-flex items-center justify-center rounded-full font-extrabold tracking-widest shadow-lg select-none";
  
  const variants = {
    homerun: { tailwind: "bg-yellow-400 text-yellow-900 ring-4 ring-yellow-200 animate-bounce text-3xl sm:text-4xl", label: "⚾ HOMERUN!" },
    '3base': { tailwind: "bg-green-500 text-white ring-4 ring-green-300 text-2xl sm:text-3xl", label: "3루타!" },
    '2base': { tailwind: "bg-blue-500 text-white ring-4 ring-blue-300 text-2xl sm:text-3xl", label: "2루타!" },
    '1base': { tailwind: "bg-indigo-400 text-white ring-4 ring-indigo-300 text-2xl sm:text-3xl", label: "1루타!" },
    strike: { tailwind: "bg-red-500 text-white ring-4 ring-red-300 text-2xl sm:text-3xl animate-shake", label: "STRIKE!" }
  };
  
  const sizeMap = {
    sm: "text-base px-3 py-1",
    md: "text-2xl px-4 py-2",
    lg: "text-4xl px-6 py-3"
  };

  const { tailwind, label } = variants[result] || variants.strike;

  return (
    <span
      role="status"
      aria-live="polite"
      aria-label={`타격 결과: ${result}`}
      className={`${baseClasses} ${tailwind} ${sizeMap[size]}`}
    >
      {label}
    </span>
  );
};





const TimingCursor = ({ progress, inHitZone, inPerfectZone }) => {
  const baseClasses = "absolute top-1/2 -translate-y-1/2 w-5 h-5 rounded-full shadow-md border-2 transition-colors duration-75";
  let variantClass = "bg-white border-gray-400";
  
  if (inPerfectZone) {
    variantClass = "bg-yellow-300 border-yellow-500 scale-125 shadow-yellow-400/80 animate-pulse";
  } else if (inHitZone) {
    variantClass = "bg-green-300 border-green-600 scale-110 shadow-green-400/60";
  }

  return (
    <div
      role="presentation"
      aria-hidden="true"
      className={`${baseClasses} ${variantClass}`}
      style={{ left: `${progress * 100}%`, transform: 'translate(-50%, -50%)' }}
    />
  );
};





const HitZoneMarker = ({
  hitZoneStart, hitZoneEnd, perfectZoneStart, perfectZoneEnd
}) => {
  return (
    <div role="presentation" aria-hidden="true" className="absolute inset-y-0 w-full pointer-events-none">
      <div 
        className="absolute inset-y-0 bg-green-400 opacity-40 rounded"
        style={{ left: `${hitZoneStart * 100}%`, width: `${(hitZoneEnd - hitZoneStart) * 100}%` }}
      />
      <div 
        className="absolute inset-y-0 bg-yellow-300 opacity-70 rounded"
        style={{ left: `${perfectZoneStart * 100}%`, width: `${(perfectZoneEnd - perfectZoneStart) * 100}%` }}
      />
    </div>
  );
};





const ActionButton = ({ disabled = false, swinging = false, onSwing }) => {
  const [isPressed, setIsPressed] = useState(false);
  const baseClasses = "flex items-center justify-center w-40 h-40 sm:w-52 sm:h-52 rounded-full cursor-pointer select-none transition-all duration-75 touch-none";
  
  let variantClass = "bg-amber-500 hover:bg-amber-400 ring-4 ring-amber-300 shadow-xl text-white";
  if (disabled) {
    variantClass = "bg-gray-700 opacity-40 cursor-not-allowed ring-4 ring-gray-600 text-gray-500";
  } else if (swinging || isPressed) {
    variantClass = "bg-amber-300 scale-90 ring-4 ring-amber-200 shadow-inner";
  }

  const handlePointerDown = (e) => {
    if (disabled) return;
    setIsPressed(true);
    onSwing();
    e.preventDefault();
  };

  const handlePointerUp = () => {
    setIsPressed(false);
  };

  return (
    <button
      role="button"
      aria-label="배트 휘두르기 — 탭 또는 클릭"
      aria-disabled={disabled}
      aria-pressed={swinging || isPressed}
      onPointerDown={handlePointerDown}
      onPointerUp={handlePointerUp}
      onPointerLeave={handlePointerUp}
      className={`${baseClasses} ${variantClass}`}
      disabled={disabled}
    >
      <span className="text-5xl sm:text-6xl drop-shadow pointer-events-none">🏏</span>
    </button>
  );
};





const ResultBadge = ({ grade, label, icon }) => {
  const baseClasses = "flex flex-col items-center gap-2 px-10 py-5 rounded-3xl shadow-2xl font-black text-center";
  const variants = {
    legend: "bg-gradient-to-br from-yellow-400 to-amber-500 text-yellow-900 ring-4 ring-yellow-200 text-4xl animate-bounce",
    great: "bg-gradient-to-br from-green-400 to-emerald-500 text-green-900 ring-4 ring-green-200 text-3xl",
    good: "bg-gradient-to-br from-blue-400 to-sky-500 text-blue-900 ring-4 ring-blue-200 text-3xl",
    out: "bg-gradient-to-br from-gray-500 to-gray-700 text-white ring-4 ring-gray-400 text-3xl"
  };

  return (
    <div role="status" aria-label={`최종 결과 등급: ${grade}`} className={`${baseClasses} ${variants[grade]}`}>
      {icon && <span className="text-5xl">{icon}</span>}
      <span>{label}</span>
    </div>
  );
};





const CountdownTimer = ({ count, visible }) => {
  if (!visible) return null;

  return (
    <div className="absolute inset-0 flex items-center justify-center z-40 pointer-events-none">
      <span 
        key={count} 
        className="text-8xl sm:text-9xl font-black text-white drop-shadow-2xl animate-ping-once"
        role="status"
        aria-live="assertive"
        aria-label={`타석 시작 카운트다운: ${count}`}
      >
        {count}
      </span>
    </div>
  );
};







const TimingBar = ({
  progress, hitZoneStart, hitZoneEnd, perfectZoneStart, perfectZoneEnd, active
}) => {
  const inHitZone = progress >= hitZoneStart && progress <= hitZoneEnd;
  const inPerfectZone = progress >= perfectZoneStart && progress <= perfectZoneEnd;

  return (
    <div 
      role="progressbar"
      aria-label="타이밍 바 — 공이 타격 존에 들어오면 배트를 휘두르세요"
      aria-valuemin={0}
      aria-valuemax={100}
      aria-valuenow={Math.round(progress * 100)}
      className="relative w-full h-8 rounded-full bg-gray-700 overflow-visible shadow-inner"
    >
      <HitZoneMarker 
        hitZoneStart={hitZoneStart}
        hitZoneEnd={hitZoneEnd}
        perfectZoneStart={perfectZoneStart}
        perfectZoneEnd={perfectZoneEnd}
      />
      {active && (
        <TimingCursor 
          progress={progress}
          inHitZone={inHitZone}
          inPerfectZone={inPerfectZone}
        />
      )}
    </div>
  );
};






const OutChanceRow = ({ totalChances = 3, usedChances }) => {
  return (
    <div 
      role="group" 
      aria-label={`기회 ${totalChances - usedChances}번 남음`}
      className="flex items-center gap-2"
    >
      {Array.from({ length: totalChances }).map((_, i) => (
        <StrikeIndicatorDot key={i} index={i} isUsed={i < usedChances} />
      ))}
    </div>
  );
};






const ScoreBoard = ({ score, currentInning, usedChances }) => {
  const [displayScore, setDisplayScore] = useState(score);

  useEffect(() => {
    let start = displayScore;
    const end = score;
    if (start === end) return;
    
    const duration = 400;
    const startTime = performance.now();
    
    const animate = (time) => {
      const elapsed = time - startTime;
      const progress = Math.min(elapsed / duration, 1);
      setDisplayScore(Math.floor(start + (end - start) * progress));
      
      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        setDisplayScore(end);
      }
    };
    
    requestAnimationFrame(animate);
  }, [score]);

  return (
    <div 
      role="region" 
      aria-label="점수판 — 현재 점수, 타석, 남은 기회 표시"
      className="flex items-center justify-between w-full px-4 py-3 bg-gray-900/80 backdrop-blur rounded-2xl shadow-lg"
    >
      <div className="flex flex-col items-start gap-0.5">
        <span className="text-xs text-gray-400 uppercase tracking-widest">SCORE</span>
        <span className="text-3xl font-black text-yellow-300 tabular-nums">{displayScore}</span>
      </div>
      <div className="flex flex-col items-center gap-0.5">
        <span className="text-xs text-gray-400 uppercase tracking-widest">INNING</span>
        <span className="text-3xl font-black text-white tabular-nums">{currentInning} / 3</span>
      </div>
      <div className="flex flex-col items-end gap-1.5">
        <span className="text-xs text-gray-400 uppercase tracking-widest">CHANCE</span>
        <OutChanceRow usedChances={usedChances} />
      </div>
    </div>
  );
};






const BallPitchCanvas = ({ pitching, progress, hitResult }) => {
  const ballSize = 12 + progress * 52; 
  const ballTop = 25 + progress * 37;
  
  return (
    <div 
      role="img" 
      aria-label="야구공 투구 애니메이션 영역"
      className="relative w-full aspect-[4/3] sm:aspect-video bg-gradient-to-b from-sky-500 via-sky-300 to-green-600 rounded-3xl overflow-hidden shadow-2xl"
    >
      <div className="absolute inset-0 opacity-50 pointer-events-none">
        <svg viewBox="0 0 100 100" className="w-full h-full text-white/20 fill-current">
            <polygon points="50,20 80,50 50,80 20,50" />
        </svg>
      </div>
      
      <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-8 h-4 rounded-full bg-amber-100 opacity-60" />
      
      {!pitching && !hitResult && (
        <div className="absolute inset-0 flex items-center justify-center text-white/70 text-xl font-bold">
          READY...
        </div>
      )}
      
      {(pitching || (hitResult && hitResult === 'strike')) && (
        <div 
          className="absolute left-1/2 -translate-x-1/2 transition-none"
          style={{ top: `${ballTop}%` }}
        >
          <BallIcon variant="flying" size={ballSize} />
        </div>
      )}

      {hitResult && hitResult !== 'strike' && (
        <div className="absolute inset-0 pointer-events-none flex items-center justify-center">
           <div className="w-full h-full border-t-4 border-dashed border-white/50 rounded-full animate-ping-once opacity-50 absolute top-1/2" />
        </div>
      )}
    </div>
  );
};






const ResultOverlay = ({ result, scoreIncrement, visible }) => {
  if (!visible || !result) return null;

  return (
    <div 
      role="alert" 
      aria-live="assertive" 
      aria-label={`타격 결과 알림: ${result}`}
      className="absolute inset-0 flex items-center justify-center z-30 pointer-events-none"
    >
      <div className="flex flex-col items-center gap-4 animate-fade-scale-in">
        <ScoreLabel result={result} size="lg" />
        {scoreIncrement > 0 && (
          <span className="text-white text-2xl font-black drop-shadow-lg animate-score-float">
            + {scoreIncrement}점
          </span>
        )}
      </div>
    </div>
  );
};





const RhythmMetronome = ({ bpm, active, beat }) => {
  return (
    <div 
      role="presentation" 
      aria-hidden="true"
      className="flex items-center justify-center gap-3 py-2"
    >
      <div className="flex items-center gap-2">
        {[0, 1, 2].map((i) => {
          const isActive = active && (beat % 3 === i);
          return (
            <span 
              key={i}
              className={`w-3 h-3 rounded-full transition-all duration-100 ${isActive ? 'bg-amber-400 scale-150 shadow-amber-300/70 shadow-md' : 'bg-gray-600 scale-100'}`}
            />
          );
        })}
      </div>
      <span className="text-xs text-gray-500 tabular-nums">{bpm} BPM</span>
    </div>
  );
};







const GameHUD = ({ score, currentInning, usedChances, bpm, beat, gamePhase }) => {
  return (
    <div 
      role="banner" 
      aria-label="게임 정보 헤더 — 점수, 타석, 기회, 박자"
      className="sticky top-0 z-30 flex flex-col gap-3 w-full px-4 pt-4 pb-3 bg-gray-950/90 backdrop-blur-md border-b border-gray-800"
    >
      <ScoreBoard score={score} currentInning={currentInning} usedChances={usedChances} />
      <RhythmMetronome bpm={bpm} active={gamePhase === 'playing'} beat={beat} />
    </div>
  );
};










const BattingStage = ({
  pitching, progress, hitResult, canSwing, showCountdown, countdownValue, onSwing, hitZoneConfig, scoreIncrement, overlayVisible
}) => {
  const isPulseVisible = progress >= hitZoneConfig.hitZoneStart && progress <= hitZoneConfig.hitZoneEnd;

  return (
    <main 
      role="main" 
      aria-label="타격 게임 스테이지"
      className="relative flex flex-col items-center gap-6 w-full px-4 py-6 flex-1 overflow-hidden"
    >
      <BallPitchCanvas pitching={pitching} progress={progress} hitResult={hitResult} />
      
      <div className="flex flex-col items-center gap-2 w-full">
        <div className="flex justify-between w-full text-xs text-gray-500 px-1">
          <span>← 너무 빠름</span>
          <span className="text-green-400 font-bold">타격 존</span>
          <span>너무 느림 →</span>
        </div>
        
        <TimingBar 
          progress={progress}
          hitZoneStart={hitZoneConfig.hitZoneStart}
          hitZoneEnd={hitZoneConfig.hitZoneEnd}
          perfectZoneStart={hitZoneConfig.perfectZoneStart}
          perfectZoneEnd={hitZoneConfig.perfectZoneEnd}
          active={pitching}
        />
        
        {isPulseVisible ? (
          <span className="text-green-400 font-extrabold text-lg tracking-widest animate-pulse">
            지금 탭!
          </span>
        ) : (
          <span className="h-7" />
        )}
      </div>
      
      <ActionButton 
        disabled={!canSwing} 
        swinging={hitResult !== null && hitResult !== 'strike'} 
        onSwing={onSwing} 
      />
      
      <ResultOverlay 
        result={hitResult} 
        scoreIncrement={scoreIncrement} 
        visible={overlayVisible} 
      />
      
      <CountdownTimer 
        count={countdownValue || ''} 
        visible={showCountdown} 
      />
    </main>
  );
};





const StartScreen = ({ onStart, selectedDifficulty, onDifficultyChange }) => {
  return (
    <main role="main" aria-label="야구 게임 시작 화면" className="flex flex-col items-center justify-center gap-8 w-full min-h-screen bg-gray-950 px-6 py-12">
      <div className="flex flex-col items-center gap-3">
        <span className="text-8xl drop-shadow-2xl">⚾</span>
        <h1 className="text-5xl sm:text-6xl font-black text-white tracking-tight text-center">탭 야구!</h1>
        <p className="text-gray-400 text-base text-center">박자에 맞춰 탭하고 홈런을 쳐내세요!</p>
      </div>

      <div className="w-full max-w-xs bg-gray-800/80 rounded-2xl px-6 py-5 flex flex-col gap-3">
        <h2 className="text-sm font-bold text-gray-300 uppercase tracking-widest mb-1">게임 방법</h2>
        <ul aria-label="게임 규칙" className="flex flex-col gap-2 text-sm text-gray-300 list-none">
          <li>🟡 노란 존(중앙)에서 탭 → 홈런! (+400점)</li>
          <li>🟢 초록 존(근처)에서 탭 → 1~3루타 (+100~300점)</li>
          <li>❌ 존 밖이거나 놓치면 → 스트라이크 (+0점)</li>
          <li>🎯 기회는 총 3번 (3타석)</li>
        </ul>
      </div>

      <div className="w-full max-w-xs flex flex-col gap-3">
        <p className="text-xs text-gray-400 uppercase tracking-widest text-center">난이도 선택</p>
        <div role="radiogroup" aria-label="게임 난이도" className="flex gap-2">
          <button 
            className={`flex-1 py-2 rounded-xl font-bold text-sm transition-all ${selectedDifficulty === 'easy' ? 'bg-green-500 text-white shadow-md' : 'bg-gray-700 text-gray-400 hover:bg-gray-600'}`}
            onClick={() => onDifficultyChange('easy')}
          >쉬움</button>
          <button 
            className={`flex-1 py-2 rounded-xl font-bold text-sm transition-all ${selectedDifficulty === 'normal' ? 'bg-amber-500 text-white shadow-md' : 'bg-gray-700 text-gray-400 hover:bg-gray-600'}`}
            onClick={() => onDifficultyChange('normal')}
          >보통</button>
          <button 
            className={`flex-1 py-2 rounded-xl font-bold text-sm transition-all ${selectedDifficulty === 'hard' ? 'bg-red-500 text-white shadow-md' : 'bg-gray-700 text-gray-400 hover:bg-gray-600'}`}
            onClick={() => onDifficultyChange('hard')}
          >어려움</button>
        </div>
      </div>

      <button 
        role="button" 
        aria-label="게임 시작"
        onClick={onStart}
        className="w-full max-w-xs py-5 rounded-2xl bg-amber-500 hover:bg-amber-400 active:bg-amber-600 active:scale-95 text-white font-extrabold text-2xl shadow-xl transition-all duration-150"
      >
        ⚾ 게임 시작!
      </button>
    </main>
  );
};







const ResultScreen = ({ totalScore, history, grade, onRestart, onHome }) => {
  const gradeMap = {
    legend: { label: "전설의 타자!", icon: "🏆" },
    great: { label: "강타자!", icon: "💪" },
    good: { label: "선전했어요!", icon: "👍" },
    out: { label: "삼진 아웃...", icon: "😢" }
  };

  return (
    <main role="main" aria-label="게임 최종 결과 화면" className="flex flex-col items-center justify-center gap-8 w-full min-h-screen bg-gray-950 px-6 py-12">
      <h2 className="text-4xl sm:text-5xl font-black text-white tracking-tight">게임 종료!</h2>
      
      <ResultBadge grade={grade} label={gradeMap[grade].label} icon={gradeMap[grade].icon} />

      <div className="flex flex-col gap-3 w-full max-w-xs">
        {history.map((h, i) => (
          <div key={i} className="flex items-center justify-between px-4 py-3 bg-gray-800 rounded-xl">
            <span className="text-gray-400 text-sm font-medium">{i + 1}타석</span>
            <ScoreLabel result={h.result} size="sm" />
            <span className="text-gray-300 text-sm font-bold tabular-nums">+{h.points}점</span>
          </div>
        ))}
      </div>

      <div className="flex items-center justify-between w-full max-w-xs px-4 py-4 bg-gray-800 rounded-2xl border border-yellow-500/30">
        <span className="text-gray-300 font-bold text-lg">최종 점수</span>
        <span className="text-yellow-300 font-black text-3xl tabular-nums">{totalScore}점</span>
      </div>

      <div className="flex flex-col gap-3 w-full max-w-xs mt-2">
        <button 
          role="button" aria-label="게임 다시 시작"
          onClick={onRestart}
          className="w-full py-4 rounded-2xl bg-amber-500 hover:bg-amber-400 active:bg-amber-600 active:scale-95 text-white font-extrabold text-xl shadow-lg transition-all"
        >🔄 다시 도전</button>
        <button 
          role="button" aria-label="홈 화면으로 이동"
          onClick={onHome}
          className="w-full py-4 rounded-2xl bg-gray-700 hover:bg-gray-600 active:bg-gray-800 active:scale-95 text-gray-200 font-bold text-lg shadow transition-all"
        >🏠 홈으로</button>
      </div>
    </main>
  );
};





const GameTemplate = ({ hud, stage }) => {
  return (
    <div 
      role="application" 
      aria-label="야구 게임 레이아웃"
      className="flex flex-col min-h-screen max-w-lg mx-auto w-full bg-gray-950 text-white overflow-hidden"
    >
      <div className="w-full flex-shrink-0">{hud}</div>
      <div className="flex-1 flex flex-col overflow-hidden">{stage}</div>
    </div>
  );
};










const difficultyConfig = {
  easy: { bpm: 60, pitchDuration: 2000, hitZone: [0.32, 0.68], perfectZone: [0.44, 0.56] },
  normal: { bpm: 80, pitchDuration: 1500, hitZone: [0.38, 0.62], perfectZone: [0.46, 0.54] },
  hard: { bpm: 100, pitchDuration: 1000, hitZone: [0.42, 0.58], perfectZone: [0.48, 0.52] }
};

const scoreMap = {
  homerun: { points: 400 },
  '3base': { points: 300 },
  '2base': { points: 200 },
  '1base': { points: 100 },
  strike: { points: 0 }
};

const BaseballGamePage = () => {
  const [gamePhase, setGamePhase] = useState('start');
  const [selectedDifficulty, setSelectedDifficulty] = useState('normal');
  const [score, setScore] = useState(0);
  const [currentInning, setCurrentInning] = useState(1);
  const [usedChances, setUsedChances] = useState(0);
  const [history, setHistory] = useState([]);
  
  const [countdownValue, setCountdownValue] = useState('');
  const [progress, setProgress] = useState(0);
  const [hitResult, setHitResult] = useState(null);
  const [scoreIncrement, setScoreIncrement] = useState(0);
  const [overlayVisible, setOverlayVisible] = useState(false);
  const [beat, setBeat] = useState(0);
  
  const config = difficultyConfig[selectedDifficulty];
  const reqRef = useRef();
  const startRef = useRef();

  useEffect(() => {
    if (gamePhase === 'countdown') {
      let step = 0;
      const values = [3, 2, 1, 'GO!'];
      setCountdownValue(values[0]);
      
      const interval = setInterval(() => {
        step++;
        if (step < values.length) {
          setCountdownValue(values[step]);
        } else {
          clearInterval(interval);
          setGamePhase('playing');
        }
      }, 1000);
      return () => clearInterval(interval);
    }
  }, [gamePhase]);

  useEffect(() => {
    if (gamePhase === 'playing') {
      const beatInterval = (60 / config.bpm) * 1000;
      const interval = setInterval(() => {
        setBeat(b => b + 1);
      }, beatInterval);
      return () => clearInterval(interval);
    }
  }, [gamePhase, config.bpm]);

  useEffect(() => {
    if (gamePhase === 'playing') {
      setProgress(0);
      setHitResult(null);
      setOverlayVisible(false);
      setScoreIncrement(0);

      const animate = (time) => {
        if (!startRef.current) startRef.current = time;
        const elapsed = time - startRef.current;
        const p = Math.min(elapsed / config.pitchDuration, 1);
        
        setProgress(p);

        if (p < 1) {
          reqRef.current = requestAnimationFrame(animate);
        } else {
          handleSwing(1);
        }
      };
      
      startRef.current = undefined;
      reqRef.current = requestAnimationFrame(animate);
      
      return () => {
        if (reqRef.current) cancelAnimationFrame(reqRef.current);
      };
    }
  }, [gamePhase]);

  const handleSwing = (currentProgress = progress) => {
    if (hitResult !== null) return;
    
    if (reqRef.current) {
      cancelAnimationFrame(reqRef.current);
    }

    let result = 'strike';
    
    const { hitZone, perfectZone } = config;
    if (currentProgress >= perfectZone[0] && currentProgress <= perfectZone[1]) {
      result = 'homerun';
    } else if (currentProgress >= hitZone[0] && currentProgress <= hitZone[1]) {
      const center = (perfectZone[0] + perfectZone[1]) / 2;
      const dist = Math.abs(currentProgress - center);
      const maxDist = (hitZone[1] - hitZone[0]) / 2;
      const ratio = dist / maxDist;
      
      if (ratio < 0.3) result = '3base';
      else if (ratio < 0.6) result = '2base';
      else result = '1base';
    }

    const points = scoreMap[result].points;
    setHitResult(result);
    setScoreIncrement(points);
    setScore(s => s + points);
    setOverlayVisible(true);
    setHistory(h => [...h, { result, points }]);

    setTimeout(() => setOverlayVisible(false), 1200);
    setTimeout(() => setGamePhase('inning-result'), 1500);
  };

  useEffect(() => {
    if (gamePhase === 'inning-result') {
      if (currentInning < 3) {
        setCurrentInning(i => i + 1);
        setUsedChances(u => u + 1);
        setGamePhase('countdown');
      } else {
        setGamePhase('finished');
      }
    }
  }, [gamePhase, currentInning]);

  const handleStart = () => {
    setScore(0);
    setCurrentInning(1);
    setUsedChances(0);
    setHistory([]);
    setGamePhase('countdown');
  };

  const getGrade = () => {
    if (score >= 1200) return 'legend';
    if (score >= 500) return 'great';
    if (score >= 100) return 'good';
    return 'out';
  };

  return (
    <div role="application" aria-label="웹 기반 야구 게임 — 탭 야구" lang="ko" className="relative w-full h-full bg-gray-950 overflow-hidden select-none">
      {gamePhase === 'start' && (
        <StartScreen 
          onStart={handleStart} 
          selectedDifficulty={selectedDifficulty}
          onDifficultyChange={setSelectedDifficulty}
        />
      )}

      {(gamePhase === 'countdown' || gamePhase === 'playing' || gamePhase === 'inning-result') && (
        <GameTemplate
          hud={
            <GameHUD 
              score={score} 
              currentInning={currentInning} 
              usedChances={usedChances}
              bpm={config.bpm}
              beat={beat}
              gamePhase={gamePhase}
            />
          }
          stage={
            <BattingStage 
              pitching={gamePhase === 'playing'}
              progress={progress}
              hitResult={hitResult}
              canSwing={gamePhase === 'playing' && hitResult === null}
              showCountdown={gamePhase === 'countdown'}
              countdownValue={countdownValue}
              onSwing={() => handleSwing(progress)}
              hitZoneConfig={{
                hitZoneStart: config.hitZone[0],
                hitZoneEnd: config.hitZone[1],
                perfectZoneStart: config.perfectZone[0],
                perfectZoneEnd: config.perfectZone[1]
              }}
              scoreIncrement={scoreIncrement}
              overlayVisible={overlayVisible}
            />
          }
        />
      )}

      {gamePhase === 'finished' && (
        <ResultScreen 
          totalScore={score}
          history={history}
          grade={getGrade()}
          onRestart={handleStart}
          onHome={() => setGamePhase('start')}
        />
      )}
    </div>
  );
};


    const App = () => {
      return <BaseballGamePage />;
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
