<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900 font-sans antialiased">

  <main role="main" aria-label="Shopping cart" class="grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-7xl mx-auto p-4 sm:p-6">
    
    <!-- Left Column: Cart Items -->
    <div class="lg:col-span-2 space-y-4">
      
      <!-- Cart Item 1 -->
      <article role="article" class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 p-4 border-b border-gray-200">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&h=200&fit=crop" alt="Smart Watch" class="w-20 h-20 object-cover rounded-md bg-gray-100" />
        
        <div class="flex-1 flex flex-col gap-1">
          <h3 class="font-semibold text-lg">Smart Watch</h3>
          <span class="text-gray-500">$199.99</span>
        </div>

        <!-- Quantity Selector -->
        <div role="group" aria-label="Quantity controls" class="flex items-center space-x-2 border rounded-md p-1">
          <button type="button" aria-label="Decrease quantity" class="p-1 text-gray-600 hover:bg-gray-100 rounded">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <span role="status" class="w-8 text-center font-medium">1</span>
          <button type="button" aria-label="Increase quantity" class="p-1 text-gray-600 hover:bg-gray-100 rounded">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>

        <button type="button" aria-label="Remove item from cart" class="text-red-500 hover:text-red-700 text-sm font-medium">
          Remove
        </button>
      </article>

      <!-- Cart Item 2 -->
      <article role="article" class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 p-4 border-b border-gray-200">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=200&h=200&fit=crop" alt="Wireless Headphones" class="w-20 h-20 object-cover rounded-md bg-gray-100" />
        
        <div class="flex-1 flex flex-col gap-1">
          <h3 class="font-semibold text-lg">Wireless Headphones</h3>
          <span class="text-gray-500">$249.00</span>
        </div>

        <!-- Quantity Selector -->
        <div role="group" aria-label="Quantity controls" class="flex items-center space-x-2 border rounded-md p-1">
          <button type="button" aria-label="Decrease quantity" class="p-1 text-gray-600 hover:bg-gray-100 rounded">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <span role="status" class="w-8 text-center font-medium">2</span>
          <button type="button" aria-label="Increase quantity" class="p-1 text-gray-600 hover:bg-gray-100 rounded">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>

        <button type="button" aria-label="Remove item from cart" class="text-red-500 hover:text-red-700 text-sm font-medium">
          Remove
        </button>
      </article>

    </div>

    <!-- Right Column: Summary -->
    <div class="lg:col-span-1">
      <aside role="complementary" aria-label="Order summary" class="flex flex-col gap-4 bg-gray-50 p-6 rounded-lg h-fit">
        <div class="flex justify-between items-center text-lg font-bold">
          <span>Subtotal</span>
          <span>$697.99</span>
        </div>
        <button type="button" role="button" class="w-full bg-blue-600 text-white py-3 px-4 rounded-md hover:bg-blue-700 font-semibold transition-colors">
          Checkout
        </button>
      </aside>
    </div>

  </main>

</body>
</html>
