<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야구 타이밍 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #030712; }
        @keyframes bounce-custom {
            0%, 100% { transform: translateY(-5%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
        .animate-bounce-custom { animation: bounce-custom 1s infinite; }
    </style>
</head>
<body class="bg-gray-950 flex justify-center items-center min-h-screen">

    <main class="flex flex-col h-[100dvh] w-full max-w-md mx-auto bg-gray-950 text-white overflow-hidden relative shadow-2xl md:rounded-3xl border border-gray-800">
        
        <!-- GameHeader -->
        <header class="flex items-center justify-between w-full px-4 py-3 bg-gray-900 border-b border-gray-700 z-10">
            <div class="flex flex-col items-center gap-0.5">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Score</span>
                <span class="text-4xl font-black tabular-nums text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.7)]">42</span>
            </div>
            
            <div class="grid grid-cols-3 grid-rows-2 w-16 h-12 place-items-center relative">
                <div class="col-start-2 row-start-1">
                    <div class="w-4 h-4 rotate-45 border-2 border-yellow-400 bg-yellow-400 shadow-[0_0_6px_2px_rgba(250,204,21,0.5)]"></div>
                </div>
                <div class="col-start-1 row-start-2">
                    <div class="w-4 h-4 rotate-45 border-2 border-gray-600 bg-transparent"></div>
                </div>
                <div class="col-start-3 row-start-2">
                    <div class="w-4 h-4 rotate-45 border-2 border-yellow-400 bg-yellow-400 shadow-[0_0_6px_2px_rgba(250,204,21,0.5)]"></div>
                </div>
            </div>
            
            <div class="flex flex-col items-center gap-1">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Out</span>
                <div class="flex gap-1.5">
                    <div class="w-3.5 h-3.5 rounded-full border-2 border-red-500 bg-red-500 shadow-[0_0_4px_rgba(239,68,68,0.6)]"></div>
                    <div class="w-3.5 h-3.5 rounded-full border-2 border-gray-500 bg-transparent"></div>
                    <div class="w-3.5 h-3.5 rounded-full border-2 border-gray-500 bg-transparent"></div>
                </div>
            </div>
        </header>
        
        <!-- GameField -->
        <div class="relative flex-1 w-full bg-gradient-to-b from-sky-900 via-green-900 to-green-800 overflow-hidden min-h-[50vh]">
            <div class="absolute inset-0 w-full h-full pointer-events-none">
                <div class="absolute inset-0 bg-[repeating-linear-gradient(0deg,transparent,transparent_40px,rgba(255,255,255,0.03)_40px,rgba(255,255,255,0.03)_41px)]"></div>
                <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-48 h-48 border-2 border-white/20 rotate-45"></div>
                <div class="absolute top-[25%] left-1/2 -translate-x-1/2 w-16 h-8 rounded-[100%] bg-yellow-800/40 border border-yellow-700/30"></div>
            </div>
            
            <div class="absolute top-[20%] left-1/2 -translate-x-1/2 flex items-center justify-center w-16 h-16 animate-bounce-custom">
                <span class="text-5xl">🤾</span>
            </div>
            
            <div class="absolute inset-0 pointer-events-none z-10">
                <div class="absolute rounded-full bg-white border border-gray-300 shadow-lg top-[60%] left-[46%] w-[25px] h-[25px]" style="transform: translate(-50%, -50%);">
                    <div class="absolute inset-0 border-2 border-red-400 rounded-full rotate-45 opacity-50"></div>
                </div>
            </div>
            
            <div class="absolute bottom-28 left-1/2 -translate-x-1/2 w-4/5 max-w-sm flex flex-col items-center gap-2">
                <span class="text-xs text-gray-400 font-medium tracking-wider uppercase">Timing</span>
                <div class="relative w-full h-4 rounded-full bg-gray-700/70 backdrop-blur-sm overflow-hidden border border-gray-600/50">
                    <div class="absolute top-0 h-full bg-yellow-400/30 border border-yellow-400/60" style="left: 78%; width: 4%;"></div>
                    <div class="h-full rounded-full bg-gradient-to-r from-green-400 to-yellow-400" style="width: 50%;"></div>
                    <div class="absolute top-1/2 -translate-y-1/2 w-1 h-6 rounded-full bg-white shadow-[0_0_6px_rgba(255,255,255,0.8)]" style="left: 50%; transform: translate(-50%, -50%);"></div>
                </div>
            </div>
        </div>

        <!-- BattingZone -->
        <div class="relative w-full flex items-center justify-center py-4 bg-gray-950/80 border-t border-gray-800 select-none h-32 md:h-40 cursor-pointer">
            <div class="w-24 h-24 flex items-center justify-center">
                <div class="w-20 h-20 flex items-center justify-center text-5xl transition-all">🧍🏏</div>
            </div>
            <div class="absolute bottom-2 left-1/2 -translate-x-1/2 text-center pointer-events-none">
                <span class="text-sm text-gray-500 font-medium tracking-wider animate-pulse">TAP!</span>
            </div>
        </div>
        
    </main>

</body>
</html>
