<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#4F46E5',
              secondary: '#6B7280',
              background: '#F9FAFB',
              surface: '#FFFFFF',
              'text-primary': '#111827',
              border: '#D1D5DB'
            }
          }
        }
      }
    </script>
</head>
<body>
    <main class="min-h-screen flex flex-col items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8" role="main" aria-label="Login Page">
        <form class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-md flex flex-col" role="form" aria-label="User Login Form">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-gray-900">Sign in to your account</h2>
            </div>
            
            <div class="space-y-4">
                <div class="flex flex-col gap-1.5 w-full">
                    <label class="text-sm font-medium text-gray-700">Email address</label>
                    <input type="email" placeholder="you@example.com" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors" role="textbox" aria-label="Input field" />
                </div>
                <div class="flex flex-col gap-1.5 w-full">
                    <label class="text-sm font-medium text-gray-700">Password</label>
                    <input type="password" placeholder="••••••••" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors" role="textbox" aria-label="Input field" />
                </div>
            </div>

            <button type="button" class="w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors" role="button" aria-label="Submit Login">
                Sign in
            </button>

            <div class="relative flex items-center py-5 w-full before:flex-grow before:border-t before:border-gray-300 after:flex-grow after:border-t after:border-gray-300" role="separator" aria-label="or">
                <span class="px-4 text-sm text-gray-500">or</span>
            </div>

            <div class="grid grid-cols-2 gap-4 w-full sm:flex sm:flex-col sm:gap-3" role="group" aria-label="Social Login Options">
                <button type="button" class="w-full inline-flex justify-center items-center gap-2 py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors" role="button" aria-label="Login with Google">
                    <span class="w-5 h-5 flex items-center justify-center text-lg">G</span>
                    <span class="hidden sm:inline">Continue with Google</span>
                    <span class="sm:hidden">Google</span>
                </button>
                <button type="button" class="w-full inline-flex justify-center items-center gap-2 py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors" role="button" aria-label="Login with Apple">
                    <span class="w-5 h-5 flex items-center justify-center text-lg">A</span>
                    <span class="hidden sm:inline">Continue with Apple</span>
                    <span class="sm:hidden">Apple</span>
                </button>
                <button type="button" class="w-full inline-flex justify-center items-center gap-2 py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors" role="button" aria-label="Login with GitHub">
                    <span class="w-5 h-5 flex items-center justify-center text-lg">GH</span>
                    <span class="hidden sm:inline">Continue with GitHub</span>
                    <span class="sm:hidden">GitHub</span>
                </button>
                <button type="button" class="w-full inline-flex justify-center items-center gap-2 py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors" role="button" aria-label="Login with Microsoft">
                    <span class="w-5 h-5 flex items-center justify-center text-lg">M</span>
                    <span class="hidden sm:inline">Continue with Microsoft</span>
                    <span class="sm:hidden">Microsoft</span>
                </button>
            </div>
        </form>
    </main>
</body>
</html>
